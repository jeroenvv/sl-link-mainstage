name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # Ubuntu's lua5.4 package installs its interpreter/compiler under these versioned names -
  # exported at job level so every script that shells out to run-lua-tests.sh (bump-version.sh,
  # build-release.sh) inherits the override too.
  LUA: lua5.4
  LUAC: luac5.4

jobs:
  release:
    runs-on: ubuntu-latest
    # A GITHUB_TOKEN-authored push does not start new workflow runs, so this whole release is one
    # job rather than being split and chained off a tag push. That means this job's own bump
    # commit lands on main without re-triggering itself - but guard anyway in case the job is ever
    # re-run manually against a ref that already carries a bump commit as its head.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run offline Lua test suite
        run: ./Scripts/run-lua-tests.sh

      - name: Determine last release tag
        id: last_tag
        run: |
          if tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null)"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
            echo "Last release tag: $tag"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
            echo "No tags found yet - treating the whole history as the range."
          fi

      - name: Check whether the shipped script changed
        id: script_changed
        # Only meaningful when a previous release exists to diff against. The very first
        # release is handled entirely by the "Initial release" path below and never needs
        # this comparison - there is deliberately no empty-tree fallback here any more.
        if: steps.last_tag.outputs.has_tag == 'true'
        run: |
          base="${{ steps.last_tag.outputs.tag }}"
          changed_files="$(git diff --name-only "$base" HEAD -- MainStageScript/)"
          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "MainStageScript/** changed since $base:"
            echo "$changed_files"
          fi

      - name: No shipped change
        if: steps.last_tag.outputs.has_tag == 'true' && steps.script_changed.outputs.changed == 'false'
        run: |
          current_version="$(tr -d '[:space:]' < VERSION)"
          echo "no shipped change, version stays at $current_version"

      - name: Initial release
        if: steps.last_tag.outputs.has_tag == 'false'
        run: |
          current_version="$(tr -d '[:space:]' < VERSION)"
          echo "No previous release tag found - this is the initial release."
          echo "Publishing v$current_version exactly, with no version bump."

      - name: Collect commits since last release
        id: commits
        # Runs for both the initial release (release notes need the commit list even though
        # there is no bump to decide) and the bump path.
        if: steps.last_tag.outputs.has_tag == 'false' || steps.script_changed.outputs.changed == 'true'
        run: |
          if [ "${{ steps.last_tag.outputs.has_tag }}" = "true" ]; then
            range="${{ steps.last_tag.outputs.tag }}..HEAD"
          else
            range="HEAD"
          fi
          # One subject per line, oldest first, for both the bump decision and the release notes.
          git log --reverse --format='%H%x09%s' "$range" > /tmp/commits-since-last-tag.tsv
          echo "Commits considered:"
          cat /tmp/commits-since-last-tag.tsv

      - name: Decide version bump
        id: bump
        if: steps.last_tag.outputs.has_tag == 'true' && steps.script_changed.outputs.changed == 'true'
        run: |
          part=""
          while IFS=$'\t' read -r sha subject; do
            body="$(git log -1 --format=%B "$sha")"
            level=""
            # grep -E rather than bash's [[ =~ ]] - some bash builds (notably macOS's stock 3.2,
            # used for the local dry run) mis-parse a nested `(...)?` group inside =~.
            if echo "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' || grep -q '^BREAKING CHANGE:' <<<"$body"; then
              level="major"
            elif echo "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              level="minor"
            elif echo "$subject" | grep -qE '^(fix|perf|refactor)(\([^)]*\))?:'; then
              level="patch"
            fi
            if [ -n "$level" ]; then
              echo "  $sha ${subject} -> $level"
            fi
            # Plain `[ cond ] && part=x` would trip `set -e` (the default for run: steps) when
            # cond is false, since a short-circuited && is only exempt from -e inside an if/while
            # test - not as a standalone statement. Use real if/then instead.
            case "$level" in
              major)
                part="major"
                ;;
              minor)
                if [ "$part" != "major" ]; then
                  part="minor"
                fi
                ;;
              patch)
                if [ -z "$part" ]; then
                  part="patch"
                fi
                ;;
            esac
          done < /tmp/commits-since-last-tag.tsv

          if [ -z "$part" ]; then
            part="patch"
            echo "No bump-worthy commit prefix (feat:/fix:/perf:/refactor:/BREAKING CHANGE) found since the last tag."
            echo "MainStageScript/** changed regardless, so defaulting to patch - a shipped change always gets a version."
          fi
          echo "Decision: $part"
          echo "part=$part" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: version
        if: steps.last_tag.outputs.has_tag == 'true' && steps.script_changed.outputs.changed == 'true'
        run: |
          ./Scripts/bump-version.sh "${{ steps.bump.outputs.part }}"
          new_version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        # Keeps CHANGELOG.md current without a human step: prepend the new version's section under the
        # [Unreleased] heading, leaving that heading in place and empty for the next cycle.
        #
        # A CURATED [Unreleased] body wins. If anything has been written there by hand it is PROMOTED
        # verbatim into the new version's section and removed from [Unreleased]; only an empty
        # [Unreleased] falls back to the generated commit-subject list. A release worth hand-writing
        # notes for - anything with a BREAKING section, in particular - is exactly the one where the
        # commit list reads worst, and without this the hand-written text was left stranded below the
        # generated section as if it belonged to the same release.
        if: steps.last_tag.outputs.has_tag == 'true' && steps.script_changed.outputs.changed == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          release_date="$(date -u +%Y-%m-%d)"

          # The [Unreleased] body: everything between that heading and the next version heading.
          awk '/^## \[Unreleased\]/ { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md \
            > /tmp/unreleased-body.md
          # Real if/then rather than `grep -q ... && ...` - same set -e reason as the bump decision.
          if grep -q '[^[:space:]]' /tmp/unreleased-body.md; then
            curated=1
          else
            curated=0
          fi
          echo "curated [Unreleased] body: $curated"

          {
            echo "## [$version] - $release_date"
            echo
            if [ "$curated" = "1" ]; then
              # Verbatim, minus leading and trailing blank lines (awk drops the trailing ones by
              # printing only as far as the last non-blank; sed drops the leading ones).
              awk 'NF { last = NR } { line[NR] = $0 }
                   END { for (i = 1; i <= last; i++) print line[i] }' \
                /tmp/unreleased-body.md | sed '/./,$!d'
            else
              # Ordered feat -> fix -> docs -> everything else, stable within each group, rather
              # than chronologically: a release note is read to decide whether to take the release,
              # so new capability leads and documentation trails.
              cut -f2 /tmp/commits-since-last-tag.tsv \
                | awk '{
                    rank = 4
                    if ($0 ~ /^feat(\([^)]*\))?!?:/) rank = 1
                    else if ($0 ~ /^fix(\([^)]*\))?!?:/) rank = 2
                    else if ($0 ~ /^docs(\([^)]*\))?!?:/) rank = 3
                    printf "%d\t%06d\t%s\n", rank, NR, $0
                  }' \
                | sort -k1,1n -k2,2n | cut -f3 | sed 's/^/- /'
            fi
          } > /tmp/changelog-section.md

          # Real if/then, not `grep -q ... && ...`, for the same set -e reason as the bump-decision
          # step above. If the [Unreleased] heading is missing, append instead of failing the release
          # - a malformed insert point should not block shipping.
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            awk -v section_file=/tmp/changelog-section.md -v curated="$curated" '
              /^## \[Unreleased\]/ && !inserted {
                print
                print ""
                while ((getline line < section_file) > 0) print line
                inserted = 1
                # A promoted body must not also stay under [Unreleased] - drop it.
                skipping = (curated == "1")
                next
              }
              skipping && /^## \[/ { skipping = 0; print "" }
              skipping { next }
              { print }
            ' CHANGELOG.md > /tmp/changelog-new.md
          else
            echo "No [Unreleased] heading found in CHANGELOG.md - appending instead."
            cat CHANGELOG.md /tmp/changelog-section.md > /tmp/changelog-new.md
          fi
          mv /tmp/changelog-new.md CHANGELOG.md

      - name: Commit version bump
        if: steps.last_tag.outputs.has_tag == 'true' && steps.script_changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README advertises the current version too - keep it in step, or it silently drifts
          # (it sat at 1.0.0 through the 2.0.0 release before this was automated).
          perl -pi -e 's/Current version: \*\*[0-9]+\.[0-9]+\.[0-9]+\*\*/Current version: **${{ steps.version.outputs.version }}**/' README.md
          git add VERSION MainStageScript/STUDIOLOGIC/SL.device/config.lua CHANGELOG.md README.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}" -m "[skip ci]"
          git push origin HEAD:main

      - name: Determine release version
        id: release_version
        # Unifies the two paths' version into one output for the steps below: the bumped
        # version when a bump just happened, or the untouched current VERSION on the very
        # first release (nothing bumped it, so it's already correct).
        if: steps.last_tag.outputs.has_tag == 'false' || steps.script_changed.outputs.changed == 'true'
        run: |
          if [ "${{ steps.last_tag.outputs.has_tag }}" = "false" ]; then
            version="$(tr -d '[:space:]' < VERSION)"
          else
            version="${{ steps.version.outputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag release
        # Runs for both paths. On the initial release there is no new commit, so this tags
        # HEAD as-is; on the bump path, HEAD is the version-bump commit just pushed above.
        if: steps.last_tag.outputs.has_tag == 'false' || steps.script_changed.outputs.changed == 'true'
        run: |
          git tag "v${{ steps.release_version.outputs.version }}"
          git push origin "v${{ steps.release_version.outputs.version }}"

      - name: Build release zip
        if: steps.last_tag.outputs.has_tag == 'false' || steps.script_changed.outputs.changed == 'true'
        run: ./Scripts/build-release.sh --output-dir "$RUNNER_TEMP/dist"

      - name: Write release notes
        if: steps.last_tag.outputs.has_tag == 'false' || steps.script_changed.outputs.changed == 'true'
        run: |
          {
            echo "Changes since ${{ steps.last_tag.outputs.tag || '(repo start)' }}:"
            echo
          } > /tmp/release-notes.md
          cut -f2 /tmp/commits-since-last-tag.tsv | sed 's/^/- /' >> /tmp/release-notes.md

      - name: Publish GitHub Release
        if: steps.last_tag.outputs.has_tag == 'false' || steps.script_changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release_version.outputs.version }}" \
            "$RUNNER_TEMP/dist/sl-link-mainstage-${{ steps.release_version.outputs.version }}.zip" \
            --title "v${{ steps.release_version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
